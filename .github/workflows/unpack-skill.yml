name: Expand skill bundle

on:
  push:
    branches:
      - main
    paths:
      - "skill.tar.xz.b64.part*"
      - ".github/workflows/unpack-skill.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand and validate skill
        shell: bash
        run: |
          set -euo pipefail
          cat skill.tar.xz.b64.part* | tr -d '[:space:]' | base64 --decode > /tmp/skill.tar.xz
          echo "e475da9c8bb70bfb4493842bdca38169efc4c57afd73b0d883601f0d9cd0ccc7  /tmp/skill.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/skill-unpack
          tar -xJf /tmp/skill.tar.xz -C /tmp/skill-unpack
          cp -a /tmp/skill-unpack/freeform-xianxia-serial-skill/. .
          rm -f skill.tar.xz.b64.part*
          rm -f .github/workflows/unpack-skill.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          python -m unittest discover -s tests -v
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add freeform xianxia serial skill v0.2.0"
          git push
