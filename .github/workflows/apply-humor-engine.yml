name: Apply humor engine code

on:
  push:
    branches:
      - agent/humor-engine-v0.3.0
    paths:
      - ".github/workflows/apply-humor-engine.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply, verify, test, and clean
        shell: bash
        run: |
          set -euo pipefail
          cat .github/humor-upload/patch/humor-code.patch.part* > /tmp/humor-code.patch
          git apply --check /tmp/humor-code.patch
          git apply /tmp/humor-code.patch

          echo "90cad8e099fffd18531574f02dbb006f10da035b02b76aad26af99ffb2c4893d  scripts/novelctl.py" | sha256sum --check --strict
          echo "766c40be25e77f923bbbf32ba7077c1c7722b4d33ff2665cad257f1f1811faf1  tests/test_novelctl.py" | sha256sum --check --strict

          python -m py_compile scripts/novelctl.py
          python -m unittest discover -s tests -v

          rm -rf .github/humor-upload
          rm -f .github/workflows/apply-humor-engine.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate humor engine state and validation"
          git push origin HEAD
